name: CI / Security & Compliance Audit

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    # Automatically scans your repository every Sunday at midnight
    - cron: '0 0 * * 0'

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      # -------------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------------
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------------
      # STEP 1: Scan for Secret Leaks
      # -------------------------------------------------------------
      - name: Scan Repository Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --debug --only-verify --rules supabase-keys,aws-keys,google-api-keys,azure-keys,heroku-api-keys,regex-high-entropy --exit-zero

      # -------------------------------------------------------------
      # STEP 2: Setup Node.js
      # -------------------------------------------------------------
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # -------------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------------
      - name: Install Dependencies
        run: npm ci

      # -------------------------------------------------------------
      # STEP 3: Audit Node.js Dependencies
      # -------------------------------------------------------------
      - name: Audit Production Dependencies
        run: npm audit --audit-level=high

      # -------------------------------------------------------------
      # STEP 4: CodeQL Static Application Security Testing
      # -------------------------------------------------------------
      - name: Initialize CodeQL Core Analysis Engine
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Execute CodeQL Static Code Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
